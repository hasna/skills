name: Publish npm prerelease (next)

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Verify release tag and default branch provenance
        run: |
          test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
          git fetch origin "${{ github.event.repository.default_branch }}:refs/remotes/origin/${{ github.event.repository.default_branch }}"
          git merge-base --is-ancestor "${GITHUB_SHA}" "origin/${{ github.event.repository.default_branch }}"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
      - name: Publish to npm
        run: npm publish --tag next --provenance --access public
