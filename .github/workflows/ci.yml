name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
      # Runs the same guard as `prepack`, but on every PR — scanning the real
      # packed file list for secrets, PII and private context. Without this the
      # scan only fires at publish time, which is too late to block a merge.
      - name: Content scan (secrets, PII, private context)
        run: bun run verify:release
