name: PLA8-00588 proof (temporary, never merged)

# Proof for hasna/skills#159. Two jobs on the same commit:
#   fixed   - the PR as written: a seeded real Sumi root is ignored, and the full suite leaves the real root untouched.
#   mutated - test-preload.ts reverted to origin/main: the same seed makes the target fail, the guard test fails,
#             and the full suite writes the real root again.
# Prints counts, exit codes and paths under XDG_CONFIG_HOME only. No credentials, no environment, no publish.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  proof:
    if: github.repository == 'hasna/skills' && github.head_ref == 'pla8-00588-proof'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [fixed, mutated]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: maintenance_fixture
          POSTGRES_DB: skills_maintenance_fixture
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U maintenance_fixture -d skills_maintenance_fixture"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Mode and runner
        run: |
          echo "mode=${{ matrix.mode }} image=${ImageVersion:-unknown} XDG_CONFIG_HOME=${XDG_CONFIG_HOME:-unset}"
          if [ -e "$XDG_CONFIG_HOME/sumi" ]; then echo "PRE real sumi root: present"; else echo "PRE real sumi root: absent"; fi

      - name: Revert the isolation (mutated only)
        if: matrix.mode == 'mutated'
        run: |
          git checkout origin/main -- apps/skills/src/test-preload.ts
          git diff --stat HEAD -- apps/skills/src/test-preload.ts

      # Same toolchain step as release-skills.yml: the copyfile runtime tests drive the pinned npm.
      - name: Install and verify the CI npm toolchain
        run: |
          set -euo pipefail
          npm_prefix="$(mktemp -d "$RUNNER_TEMP/npm-toolchain.XXXXXX")"
          npm install --global --prefix "$npm_prefix" npm@11.19.0
          test "$("$npm_prefix/bin/npm" --version)" = 11.19.0
          echo "$npm_prefix/bin" >> "$GITHUB_PATH"

      - name: Install locked standalone Skills dependencies
        working-directory: apps/skills
        run: bun install --frozen-lockfile --ignore-scripts --backend copyfile

      - name: Build
        working-directory: apps/skills
        run: |
          umask 022
          bun run build

      - name: Seeded leak, target and guard
        working-directory: apps/skills
        run: |
          set -uo pipefail
          seed="$XDG_CONFIG_HOME/sumi/skills/seeded-sentinel"
          mkdir -p "$seed" && printf '# seeded sentinel\n' > "$seed/SKILL.md"
          t=0; bun test --timeout 30000 src/lib/native-target-manifest.test.ts > "$RUNNER_TEMP/target.log" 2>&1 || t=$?
          echo "SEEDED target exit=$t $(grep -E ' (pass|fail)$' "$RUNNER_TEMP/target.log" | tr -s ' ' | tr '\n' ' ')"
          g=0; bun test --timeout 30000 src/test-preload-selectors.test.ts > "$RUNNER_TEMP/guard.log" 2>&1 || g=$?
          echo "GUARD exit=$g $(grep -E ' (pass|fail)$' "$RUNNER_TEMP/guard.log" | tr -s ' ' | tr '\n' ' ')"
          echo "$t" > "$RUNNER_TEMP/seeded.exit"; echo "$g" > "$RUNNER_TEMP/guard.exit"
          mv "$XDG_CONFIG_HOME/sumi" "$RUNNER_TEMP/seeded-aside"
          if [ -e "$XDG_CONFIG_HOME/sumi" ]; then echo "after seed removal: present"; else echo "after seed removal: absent"; fi

      - name: Full suite, then the real root
        working-directory: apps/skills
        env:
          HASNA_SKILLS_MAINTENANCE_TEST_DATABASE_URL: postgres://maintenance_fixture@127.0.0.1:5432/skills_maintenance_fixture
          HASNA_SKILLS_INSPECTION_TEST_DATABASE_URL: postgres://inspection_fixture@127.0.0.1:5432/skills_inspection_fixture
          NO_COLOR: "1"
        run: |
          set -uo pipefail
          bun -e '
            import { SQL } from "bun";
            const sql = new SQL(process.env.HASNA_SKILLS_MAINTENANCE_TEST_DATABASE_URL, { max: 1 });
            try { await sql.unsafe("CREATE ROLE inspection_fixture LOGIN"); await sql.unsafe("CREATE DATABASE skills_inspection_fixture OWNER inspection_fixture"); } finally { await sql.close(); }
          '
          s=0; bun test --timeout 30000 > "$RUNNER_TEMP/full.log" 2>&1 || s=$?
          echo "FULL exit=$s $(grep -E '^ [0-9]+ (pass|fail)$' "$RUNNER_TEMP/full.log" | tr -s ' ' | tr '\n' ' ')"
          grep -E '\(fail\)' "$RUNNER_TEMP/full.log" | sed -E 's/ \[[0-9.]+m?s\]$//' | sort -u | head -40 || true
          if [ -e "$XDG_CONFIG_HOME/sumi" ]; then echo "POST real sumi root: present: $(cd "$XDG_CONFIG_HOME/sumi" && find . -maxdepth 3 | sort | tr '\n' ' ')"; else echo "POST real sumi root: absent"; fi
          t=0; bun test --timeout 30000 src/lib/native-target-manifest.test.ts > "$RUNNER_TEMP/target2.log" 2>&1 || t=$?
          echo "AFTER-SUITE target exit=$t $(grep -E ' (pass|fail)$' "$RUNNER_TEMP/target2.log" | tr -s ' ' | tr '\n' ' ')"
          # Strict verdict, identical in both modes: green only if the isolation holds.
          # Expected: fixed green; mutated red, with the reasons printed above.
          bad=""
          [ "$s" -eq 0 ] || bad="$bad full-suite-exit=$s"
          [ ! -e "$XDG_CONFIG_HOME/sumi" ] || bad="$bad real-sumi-root-present"
          [ "$t" -eq 0 ] || bad="$bad after-suite-target-exit=$t"
          [ "$(cat "$RUNNER_TEMP/seeded.exit")" = "0" ] || bad="$bad seeded-target-exit=$(cat "$RUNNER_TEMP/seeded.exit")"
          [ "$(cat "$RUNNER_TEMP/guard.exit")" = "0" ] || bad="$bad guard-exit=$(cat "$RUNNER_TEMP/guard.exit")"
          if [ -n "$bad" ]; then echo "VERDICT ${{ matrix.mode }}: RED:$bad"; exit 1; fi
          echo "VERDICT ${{ matrix.mode }}: GREEN"
