name: Release skills to npm

# The only path that may publish @hasna/skills. It refuses to reach npm unless an
# independent reviewer's GO, recorded in git-prs for this exact candidate, and
# the git-publishing intent thread are linked in the annotated release tag with the SHA-256 of
# the tarball this exact checkout packs.
#
# This replaces apps/skills/.github/workflows/publish.yml, which GitHub Actions
# never ran (workflows are discovered only from the repository root) and which
# published on a bare `v*` tag with no review linkage at all.
#
# workflow_dispatch is the dry run: pass the release tag to exercise every step,
# including the review-linkage preflight, without publishing. It never publishes.
on:
  push:
    tags:
      - "npm/skills/v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to dry-run, e.g. npm/skills/v0.10.10 (nothing is published)"
        required: false

concurrency:
  group: hasna-skills-npm-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Credential-isolated frozen install (SH-00052). @hasna/secrets is a restricted package, so the frozen install
  # needs an authenticated registry read. It runs in this job, which has no id-token, no environment and read-only
  # contents, so the read token never enters the candidate or publish job: their steps are shared through the
  # release-steps anchor, and an install step among them would hand the token to the publish job as well. Both
  # jobs restore this job's tree instead, bound to the same commit, lockfile and manifest.
  install:
    # The workflow triggers only on npm/skills/v* tags and dispatches, and the first step refuses anything else.
    if: github.repository == 'hasna/skills'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Admit only a release tag push or a dispatch
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            workflow_dispatch) ;;
            push) [[ "$REF" =~ ^refs/tags/npm/skills/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "refusing: $REF is not a release tag"; exit 1; } ;;
            *) echo "refusing: event $EVENT_NAME"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The same ref the candidate and publish jobs check out; the restore step there refuses any other.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
          # A job holding a registry credential neither restores nor saves a toolchain cache.
          no-cache: true

      # This source checkout is standalone; its pinned graph belongs to apps/skills.
      - name: Install locked standalone Skills dependencies (credential isolated)
        working-directory: apps/skills
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_RELEASE_READ_TOKEN }}
        run: |
          set -euo pipefail
          # The one step in its job that holds a registry credential (SH-00052).
          # @hasna/secrets is a restricted package, so the frozen install needs an authenticated read.
          # NPM_RELEASE_READ_TOKEN is a read-only granular token for that package alone, stored as a
          # repository Actions secret. Fork and Dependabot pull requests receive no secrets: an empty
          # value fails closed here instead of falling back to an anonymous install that would 404 and
          # read as a broken lockfile rather than a missing credential.
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_RELEASE_READ_TOKEN is empty or unset. The frozen install needs this read-only repository Actions secret to read the restricted @hasna/secrets package; fork and Dependabot pull requests receive no secrets."
            exit 1
          fi
          # The credential reaches bun only through a throwaway HOME/.npmrc: bun 1.3.14 ignores an
          # npmrc named by NPM_CONFIG_USERCONFIG and honours HOME/.npmrc (measured in hasna/apps
          # H10-02274). The value is written by the shell builtin printf, so it never sits in a
          # process argv, and the file is removed when this step exits, on failure as on success.
          # Shell command tracing is never enabled in this step.
          cred_home="$(mktemp -d "${RUNNER_TEMP%/}/npm-read-home.XXXXXX")"
          trap 'rm -f "$cred_home/.npmrc"' EXIT
          umask 077
          chmod 700 "$cred_home"
          {
            printf 'registry=https://registry.npmjs.org/\n'
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN"
          } > "$cred_home/.npmrc"
          chmod 600 "$cred_home/.npmrc"
          cache_dir="$(mktemp -d "${RUNNER_TEMP%/}/bun-install-cache.XXXXXX")"
          # `env -u NODE_AUTH_TOKEN`: bun expands ${VAR} references inside a committed .npmrc, so the
          # variable is kept out of bun's environment and the literal auth line above is the only
          # route by which the value reaches the registry. The registry is pinned three ways.
          HOME="$cred_home" \
          BUN_INSTALL_CACHE_DIR="$cache_dir" \
          BUN_CONFIG_REGISTRY="https://registry.npmjs.org/" \
            env -u NODE_AUTH_TOKEN bun install --frozen-lockfile --ignore-scripts --backend copyfile --registry https://registry.npmjs.org/
          # Nothing the install left behind may carry the credential to a later step or job: no
          # .npmrc under node_modules or the install cache, and no file containing the token bytes.
          # The scan reads the value from its environment only and prints counts, never a value; an
          # unreadable path or an empty scan fails rather than passing.
          SCAN_ROOTS="node_modules:$cache_dir" python3 -I - <<'PYEOF'
          import os
          import sys

          token = os.environ.get("NODE_AUTH_TOKEN", "").encode()
          if not token:
              print("::error::the token is empty in the scan")
              sys.exit(1)
          errors, npmrc, hits = [], [], []
          files = links = 0
          chunk = 1 << 20

          def on_error(exc):
              errors.append(str(exc))

          for root in os.environ["SCAN_ROOTS"].split(":"):
              if not os.path.isdir(root):
                  errors.append("%s: not a directory" % root)
                  continue
              for dirpath, _dirnames, filenames in os.walk(root, onerror=on_error):
                  for name in filenames:
                      path = os.path.join(dirpath, name)
                      if name == ".npmrc":
                          npmrc.append(path)
                          continue
                      if os.path.islink(path):
                          links += 1
                          continue
                      files += 1
                      try:
                          with open(path, "rb") as handle:
                              tail = b""
                              while True:
                                  piece = handle.read(chunk)
                                  if not piece:
                                      break
                                  blob = tail + piece
                                  if token in blob:
                                      hits.append(path)
                                      break
                                  tail = blob[-(len(token) - 1):] if len(token) > 1 else b""
                      except OSError as exc:
                          errors.append("%s: %s" % (path, exc))

          if errors:
              print("::error::could not read %d path(s) after the install; an unreadable scan is not a pass" % len(errors))
              for line in errors[:10]:
                  print(line)
              sys.exit(1)
          if npmrc:
              print("::error::the installed tree contains %d .npmrc path(s)" % len(npmrc))
              for path in npmrc[:10]:
                  print(path)
              sys.exit(1)
          if files == 0:
              print("::error::scanned 0 files after the install; the coverage this step claims was never established")
              sys.exit(1)
          if hits:
              print("::error::%d installed file(s) contain the registry token" % len(hits))
              sys.exit(1)
          print("scanned %d files (%d symlinks skipped) after the install: no .npmrc, no token bytes" % (files, links))
          PYEOF

      # tar, not the artifact action's own zip: the tree keeps its node_modules/.bin symlinks. The binding records
      # the commit, lockfile and manifest the tree was installed from; the restoring job compares its own.
      - name: Archive the installed tree with its commit, lockfile and manifest binding
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/skills-installed"
          mkdir -p "$out"
          tar -C apps/skills -cf "$out/node-modules.tar" node_modules
          { git rev-parse HEAD; sha256sum apps/skills/bun.lock apps/skills/package.json; } > "$out/binding.txt"
          ls -l "$out"

      - name: Retain the installed tree for the candidate or publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skills-installed-dependencies
          path: |
            ${{ runner.temp }}/skills-installed/node-modules.tar
            ${{ runner.temp }}/skills-installed/binding.txt
          if-no-files-found: error
          retention-days: 1

  # A dispatch (the candidate build or a tag dry run) holds no id-token and enters no publishing environment: it
  # runs in skills-candidate, which has no protection rules and nothing that can publish. Only a pushed release
  # tag reaches npm-publish-skills, whose deployment policy admits npm/skills/v* tags alone; a repository ruleset
  # lets only the hasna-identity App create those tags (PLA8-00581, SH-00015). Both jobs run the same steps.
  #
  # npm-release-skills is retired, not reused: every earlier npm/skills/v* tag carries a workflow whose dispatch
  # requested it with id-token: write and checked out an arbitrary `tag` input. It keeps its required reviewer and
  # admits only npm/skills/v0.0.0-retired, a tag that is never created, so those old workflows can never reach a
  # publish credential again.
  candidate:
    if: github.repository == 'hasna/skills' && github.event_name == 'workflow_dispatch'
    needs: install
    runs-on: ubuntu-latest
    services: &release-services
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: maintenance_fixture
          POSTGRES_DB: skills_maintenance_fixture
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U maintenance_fixture -d skills_maintenance_fixture"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # No publish credential: no id-token permission, and no publishing environment.
    environment: skills-candidate
    timeout-minutes: 60
    permissions:
      contents: read
    env: &release-env
      NODE_OPTIONS: --max-old-space-size=14336
      # On a tag push this is the release tag. On a dispatch dry run it is the
      # `tag` input; without it the tag-dependent steps are skipped and nothing
      # can publish, because every publish step also requires a push event.
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    defaults: &release-defaults
      run:
        shell: bash
    steps: &release-steps
      - name: Admit only a release tag push or a dispatch
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            workflow_dispatch) ;;
            push) [[ "$REF" =~ ^refs/tags/npm/skills/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "refusing: $REF is not a release tag"; exit 1; } ;;
            *) echo "refusing: event $EVENT_NAME"; exit 1 ;;
          esac

      # Defence in depth for a tag push (SH-00015, engineering conditions 4 and 5): the tag must be annotated by the
      # hasna-identity App, and the protection that admitted this run must still be the recorded one. Every read is
      # public for this repository; the token only avoids rate limits. Any difference refuses before checkout.
      - name: Require the App's release tag and the recorded release protection
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          api() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/hasna/skills/$1"; }
          refuse() { echo "refusing: $1"; exit 1; }
          ref="$(api "git/ref/tags/$REF_NAME")"
          [ "$(jq -r .object.type <<< "$ref")" = tag ] || refuse "the release tag is not annotated"
          tag="$(api "git/tags/$(jq -r .object.sha <<< "$ref")")"
          [ "$(jq -r .tagger.name <<< "$tag")" = "hasna-identity[bot]" ] || refuse "the release tag was not created by the hasna-identity App"
          envjson="$(api environments/npm-publish-skills)"
          jq -e '.can_admins_bypass == false
            and .deployment_branch_policy.protected_branches == false
            and .deployment_branch_policy.custom_branch_policies == true
            and ([.protection_rules[]?.type] | index("required_reviewers") | not)' <<< "$envjson" > /dev/null \
            || refuse "npm-publish-skills differs from the recorded configuration"
          policies="$(api environments/npm-publish-skills/deployment-branch-policies)"
          jq -e '[.branch_policies[] | {name, type}] == [{"name": "npm/skills/v*", "type": "tag"}]' <<< "$policies" > /dev/null \
            || refuse "npm-publish-skills must admit npm/skills/v* tags only"
          # The retired environment must stay closed: a required reviewer, and a policy admitting only
          # npm/skills/v0.0.0-retired, a tag under the App-only ruleset that is never created. (An empty custom
          # policy list admits every ref, measured 2026-10-22, so it is not used.)
          retired="$(api environments/npm-release-skills)"
          jq -e '.can_admins_bypass == false and .deployment_branch_policy.custom_branch_policies == true
            and ([.protection_rules[]?.type] | index("required_reviewers"))' <<< "$retired" > /dev/null \
            || refuse "npm-release-skills must keep its reviewer and a custom policy"
          api environments/npm-release-skills/deployment-branch-policies \
            | jq -e '[.branch_policies[] | {name, type}] == [{"name": "npm/skills/v0.0.0-retired", "type": "tag"}]' > /dev/null \
            || refuse "npm-release-skills must admit only the never-created npm/skills/v0.0.0-retired tag"
          ids="$(api 'rulesets?targets=tag' | jq -r '[.[] | select(.name == "npm-skills-release-tags" and .target == "tag" and .enforcement == "active") | .id] | @tsv')"
          [ -n "$ids" ] && [ "$(wc -w <<< "$ids" | tr -d ' ')" = 1 ] || refuse "exactly one active npm-skills-release-tags ruleset is required"
          ruleset="$(api "rulesets/$ids")"
          # Public reads omit bypass_actors, so the App-only bypass is verified at configuration time, not here.
          jq -e '.conditions.ref_name.include == ["refs/tags/npm/skills/v*"]
            and ((.conditions.ref_name.exclude // []) == [])
            and ([.rules[].type] | (index("creation") and index("update") and index("deletion")))' <<< "$ruleset" > /dev/null \
            || refuse "the npm-skills-release-tags ruleset differs from the recorded configuration"
          echo "release tag and protection verified"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A dispatch dry run of a tag checks out that tag, qualified as refs/tags/ so a branch of the same name
          # can never be chosen instead; a push uses its own event SHA, which the next step requires to be the
          # tag's commit.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the exact release commit on protected main
        if: github.event_name == 'push'
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          test "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          node --input-type=module -e '
            const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/branches/main`, {
              headers: {
                Authorization: `Bearer ${process.env.GH_READ_TOKEN}`,
                Accept: "application/vnd.github+json",
                "X-GitHub-Api-Version": "2022-11-28",
              },
              signal: AbortSignal.timeout(30000),
            });
            if (!response.ok) throw new Error(`main branch protection lookup failed: HTTP ${response.status}`);
            const branch = await response.json();
            if (branch.name !== "main" || branch.protected !== true) {
              throw new Error("main is not protected at release time");
            }
          '

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install and verify the CI npm toolchain
        run: |
          set -euo pipefail
          npm_prefix="$(mktemp -d "$RUNNER_TEMP/npm-toolchain.XXXXXX")"
          npm install --global --prefix "$npm_prefix" npm@11.19.0
          test "$("$npm_prefix/bin/npm" --version)" = 11.19.0
          echo "$npm_prefix/bin" >> "$GITHUB_PATH"

      - name: Bind the release tag to the skills manifest
        id: version
        if: env.RELEASE_TAG != ''
        run: |
          set -euo pipefail
          node --input-type=module -e '
            const { appendFileSync, readFileSync } = await import("node:fs");
            const tag = process.env.RELEASE_TAG;
            const prefix = "npm/skills/v";
            if (!tag.startsWith(prefix)) throw new Error("the release tag must use the " + prefix + "<semver> form");
            const version = tag.slice(prefix.length);
            if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version)) throw new Error("the release tag must carry a semver version");
            const manifest = JSON.parse(readFileSync("apps/skills/package.json", "utf8"));
            if (manifest.name !== "@hasna/skills") throw new Error("apps/skills/package.json must declare @hasna/skills");
            if (manifest.publishConfig?.registry !== "https://registry.npmjs.org" || manifest.publishConfig?.access !== "public") {
              throw new Error("apps/skills must publish publicly to the npm registry");
            }
            if (manifest.version !== version) {
              throw new Error("the release tag must carry apps/skills/package.json version " + manifest.version);
            }
            appendFileSync(process.env.GITHUB_OUTPUT, "version=" + version + "\n");
          '

      - name: Reject an already-published version or an inconclusive registry lookup
        if: env.RELEASE_TAG != ''
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          node --input-type=module -e '
            const version = process.env.RELEASE_VERSION;
            const url = "https://registry.npmjs.org/@hasna%2Fskills/" + encodeURIComponent(version);
            const response = await fetch(url, { signal: AbortSignal.timeout(30000) });
            if (response.status === 404) {
              console.log("@hasna/skills@" + version + " is not published");
            } else if (response.ok) {
              throw new Error("@hasna/skills@" + version + " is already published");
            } else {
              throw new Error("Registry lookup failed: HTTP " + response.status);
            }
          '

      # This source checkout is standalone; its pinned graph belongs to apps/skills. The tree comes from the
      # credential-isolated install job (SH-00052): this job never holds the registry read token.
      - name: Restore the credential-isolated dependency install
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: skills-installed-dependencies
          path: ${{ runner.temp }}/skills-installed

      - name: Unpack the installed tree bound to this commit, lockfile and manifest
        run: |
          set -euo pipefail
          installed="$RUNNER_TEMP/skills-installed"
          expected="$RUNNER_TEMP/skills-installed-binding.expected"
          { git rev-parse HEAD; sha256sum apps/skills/bun.lock apps/skills/package.json; } > "$expected"
          if ! cmp -s "$installed/binding.txt" "$expected"; then
            echo "::error::the restored dependency tree was installed from a different commit, lockfile or manifest"
            exit 1
          fi
          test ! -e apps/skills/node_modules
          tar -C apps/skills -xf "$installed/node-modules.tar"
          test -d apps/skills/node_modules

      - name: Scan changed source lines for credentials
        working-directory: apps/skills
        run: bun run scripts/scan-changed-secrets.ts refs/remotes/origin/main

      - name: Verify the standalone Skills producer graph
        working-directory: apps/skills
        run: |
          set -euo pipefail
          bun run verify:producer > "$RUNNER_TEMP/skills-producer-receipt.json"
          node --input-type=module -e '
            const { readFileSync } = await import("node:fs");
            const receipt = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/skills-producer-receipt.json", "utf8"));
            if (receipt.status !== "verified" || receipt.package?.name !== "@hasna/skills") {
              throw new Error("standalone Skills producer graph verification did not pass");
            }
            console.log(`Verified standalone Skills producer graph: ${receipt.nodeCount} nodes, ${receipt.edgeCount} edges`);
          '

      - name: Typecheck
        working-directory: apps/skills
        run: bun run typecheck

      - name: Build
        working-directory: apps/skills
        run: |
          umask 022
          bun run build

      - name: Test
        working-directory: apps/skills
        env:
          HASNA_SKILLS_MAINTENANCE_TEST_DATABASE_URL: postgres://maintenance_fixture@127.0.0.1:5432/skills_maintenance_fixture
          HASNA_SKILLS_INSPECTION_TEST_DATABASE_URL: postgres://inspection_fixture@127.0.0.1:5432/skills_inspection_fixture
          NO_COLOR: "1"
        run: |
          set -euo pipefail
          bun -e '
            import { SQL } from "bun";
            const sql = new SQL(process.env.HASNA_SKILLS_MAINTENANCE_TEST_DATABASE_URL, { max: 1 });
            try {
              await sql.unsafe("CREATE ROLE inspection_fixture LOGIN");
              await sql.unsafe("CREATE DATABASE skills_inspection_fixture OWNER inspection_fixture");
            } finally {
              await sql.close();
            }
          '
          test_log="$RUNNER_TEMP/skills-test.log"
          native_stub_dir="$(mktemp -d "$RUNNER_TEMP/skills-native-cli-guard.XXXXXX")"
          cat > "$native_stub_dir/claude" <<'STUB'
          #!/bin/sh
          set -eu
          printf 'called\n' > "${SKILLS_TEST_CLAUDE_SENTINEL:?}"
          printf '%s\n' 'UNEXPECTED_NATIVE_CLAUDE_CALL' >&2
          exit 97
          STUB
          chmod 700 "$native_stub_dir/claude"
          # Prove the sentinel detects a call before relying on a zero. Keep
          # this separate control marker; no fixture files need to be deleted.
          control_status=0
          SKILLS_TEST_CLAUDE_SENTINEL="$native_stub_dir/control.called" "$native_stub_dir/claude" 2>/dev/null || control_status=$?
          test "$control_status" -eq 97
          test "$(cat "$native_stub_dir/control.called")" = called
          export SKILLS_TEST_CLAUDE_SENTINEL="$native_stub_dir/full-suite.called"
          export PATH="$native_stub_dir:$PATH"
          # File publication does not invoke package lifecycle hooks. Run the
          # unchanged package-owned gate here, before the archive is sealed.
          set +e
          bun run prepublishOnly 2>&1 | tee "$test_log"
          test_statuses=("${PIPESTATUS[@]}")
          set -e
          test "${#test_statuses[@]}" -eq 2
          printf 'Full-suite exit=%s; log exit=%s\n' "${test_statuses[0]}" "${test_statuses[1]}"
          if [ "${test_statuses[0]}" -ne 0 ]; then exit "${test_statuses[0]}"; fi
          if [ "${test_statuses[1]}" -ne 0 ]; then exit "${test_statuses[1]}"; fi
          test ! -e "$SKILLS_TEST_CLAUDE_SENTINEL"
          printf '%s\n' 'Full-suite native Claude sentinel: no calls'
          grep -F '(pass) PostgreSQL enrollment has no initialization writes and retains atomic CAS, audit, replay and rollback' "$test_log"
          grep -F '(pass) isolated PostgreSQL inspection is bounded, ordered, sanitized and enforced read-only' "$test_log"

      - name: Run package-owned prepack gates before sealing the archive
        working-directory: apps/skills
        run: bun run prepack

      - name: Retain the verified candidate archive for independent review
        if: github.event_name == 'workflow_dispatch' && env.RELEASE_TAG == ''
        working-directory: apps/skills
        run: |
          set -euo pipefail
          umask 022
          bun run scripts/retain-candidate-archive.ts --destination "$RUNNER_TEMP/skills-candidate-archive"

      - name: Upload only the verified candidate archive and receipts
        if: github.event_name == 'workflow_dispatch' && env.RELEASE_TAG == ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skills-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/skills-candidate-archive/hasna-skills-*.tgz
            ${{ runner.temp }}/skills-candidate-archive/candidate-receipt.json
            ${{ runner.temp }}/skills-candidate-archive/consumer-receipt.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      # The gate. It reads the annotated tag's linkage fields, packs this exact
      # checkout and refuses unless the recorded Packed-SHA256 matches. The
      # publish step below cannot run unless this step succeeded.
      #
      # The resolved release tag is passed explicitly. The preflight falls back to
      # GITHUB_REF_NAME, which on a workflow_dispatch dry run is the dispatch ref
      # (the branch), so without this argument a documented dry run would fail on
      # refs/tags/<branch> instead of checking the tag under review. Push runs
      # pass github.ref_name; dry runs pass the `tag` input. An empty value cannot
      # silently fall back: the preflight refuses a `--tag` with no value.
      - name: Verify the linked independent release review for the release tag
        id: review
        if: env.RELEASE_TAG != ''
        working-directory: apps/skills
        run: |
          set -euo pipefail
          archive_dir="$(mktemp -d "$RUNNER_TEMP/skills-reviewed-archive.XXXXXX")"
          review_log="$RUNNER_TEMP/skills-release-review.log"
          bun run verify:release-review --tag "$RELEASE_TAG" --pack-destination "$archive_dir" > "$review_log"
          ARCHIVE_DIR="$archive_dir" REVIEW_LOG="$review_log" node --input-type=module -e '
            const { appendFileSync, readFileSync, writeFileSync } = await import("node:fs");
            const { join } = await import("node:path");
            const receipt = JSON.parse(readFileSync(process.env.REVIEW_LOG, "utf8").split("\n")[0]);
            if (receipt.schema !== "hasna.skills.release-review-linkage.v1"
              || !/^hasna-skills-\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?\.tgz$/.test(receipt.packed_filename)
              || !/^[a-f0-9]{64}$/.test(receipt.packed_sha256)
              || typeof receipt.packed_integrity !== "string"
              || !receipt.packed_integrity.startsWith("sha512-")) {
              throw new Error("the reviewed archive receipt is invalid");
            }
            const receiptPath = join(process.env.RUNNER_TEMP, "skills-release-review.json");
            writeFileSync(receiptPath, JSON.stringify(receipt) + "\n", { flag: "wx", mode: 0o600 });
            appendFileSync(process.env.GITHUB_OUTPUT, `integrity=${receipt.packed_integrity}\nsha256=${receipt.packed_sha256}\narchive=${join(process.env.ARCHIVE_DIR, receipt.packed_filename)}\nreceipt=${receiptPath}\n`);
            console.log(JSON.stringify(receipt));
          '

      - name: Verify the exact retained release archive as an installed consumer
        id: consumer
        if: env.RELEASE_TAG != '' && steps.review.outcome == 'success'
        working-directory: apps/skills
        env:
          REVIEWED_ARCHIVE: ${{ steps.review.outputs.archive }}
          REVIEWED_SHA256: ${{ steps.review.outputs.sha256 }}
        run: |
          set -euo pipefail
          bun run verify:consumer-types --archive "$REVIEWED_ARCHIVE" --sha256 "$REVIEWED_SHA256" --receipt "$RUNNER_TEMP/skills-consumer-archive.json"

      - name: Publish the accepted archive via OIDC
        if: github.event_name == 'push' && steps.review.outcome == 'success' && steps.consumer.outcome == 'success'
        working-directory: apps/skills
        env:
          REVIEWED_ARCHIVE: ${{ steps.review.outputs.archive }}
          REVIEW_RECEIPT: ${{ steps.review.outputs.receipt }}
        run: |
          set -euo pipefail
          bun run scripts/publish-reviewed-archive.ts --archive "$REVIEWED_ARCHIVE" --review-receipt "$REVIEW_RECEIPT" --consumer-receipt "$RUNNER_TEMP/skills-consumer-archive.json"

      - name: Verify the published version, integrity and provenance attestations
        if: github.event_name == 'push' && steps.review.outcome == 'success' && steps.consumer.outcome == 'success'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_INTEGRITY: ${{ steps.review.outputs.integrity }}
        run: |
          set -euo pipefail
          node --input-type=module -e '
            const version = process.env.RELEASE_VERSION;
            const expectedIntegrity = process.env.EXPECTED_INTEGRITY;
            const base = `https://registry.npmjs.org/@hasna%2Fskills/${encodeURIComponent(version)}`;
            let last = "no registry response";
            // The registry accepted 0.10.9 before its version endpoint became visible.
            // A nonce avoids a cached 404 while the immutable version propagates.
            for (let attempt = 1; attempt <= 40; attempt++) {
              let response;
              try {
                response = await fetch(`${base}?verify=${Date.now()}-${attempt}`, {
                  headers: { Accept: "application/json", "Cache-Control": "no-cache" },
                  signal: AbortSignal.timeout(30000),
                });
              } catch {
                last = "registry transport failure";
              }
              if (response) {
                if (response.status === 404 || response.status >= 500) {
                  last = `HTTP ${response.status}`;
                } else if (!response.ok) {
                  throw new Error(`registry lookup refused: HTTP ${response.status}`);
                } else {
                  const published = await response.json();
                  if (published.name !== "@hasna/skills" || published.version !== version) {
                    throw new Error("the registry reports a different package or version");
                  }
                  if (published.dist?.integrity !== expectedIntegrity) {
                    throw new Error("the published archive integrity differs from the reviewed archive");
                  }
                  const attestations = published.dist?.attestations;
                  if (attestations?.url && attestations.provenance?.predicateType === "https://slsa.dev/provenance/v1") {
                    console.log(`Verified ${version}: registry integrity matches reviewed archive; npm provenance present`);
                    process.exit(0);
                  }
                  last = "provenance attestation not visible yet";
                }
              }
              if (attempt < 40) await new Promise(resolve => setTimeout(resolve, 15000));
            }
            throw new Error(`@hasna/skills@${version} was not fully visible after ten minutes (${last})`);
          '

  publish:
    if: github.repository == 'hasna/skills' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/npm/skills/v')
    needs: install
    runs-on: ubuntu-latest
    services: *release-services
    # Skills-only publishing environment. Its deployment policy admits npm/skills/v*
    # tags only, and only the hasna-identity App may create those tags. Changes to
    # the environment or the ruleset are repository-protection changes owned by the
    # engineering seat. The workflow names the environment; it does not create it.
    environment: npm-publish-skills
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env: *release-env
    defaults: *release-defaults
    steps: *release-steps
