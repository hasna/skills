name: Promote npm prerelease to latest

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type promote-0.2.0-after-live-proof"
        required: true
        type: string
      platform_sha:
        description: "Exact 40-character platform commit SHA reported by the live service"
        required: true
        type: string
      platform_version:
        description: "Exact live @hasnatools/platform-skills version"
        required: true
        type: string
      deployment_id:
        description: "Exact immutable deployment ID reported by the live cloud service"
        required: true
        type: string
      client_pin:
        description: "Exact @hasna/skills version exposed by the live cloud catalog"
        required: true
        type: string

concurrency:
  group: npm-promote-hasna-skills
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Verify immutable live deployment identity and client contract
        shell: bash
        env:
          SKILLS_PROMOTION_API_KEY: ${{ secrets.SKILLS_PROMOTION_API_KEY }}
          PLATFORM_SHA: ${{ inputs.platform_sha }}
          PLATFORM_VERSION: ${{ inputs.platform_version }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          CLIENT_PIN: ${{ inputs.client_pin }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "hasna/skills"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test "$CONFIRMATION" = "promote-0.2.0-after-live-proof"
          test "$(node -p "require('./package.json').version")" = "0.2.0"
          test "$CLIENT_PIN" = "0.2.0"
          printf '%s' "$PLATFORM_SHA" | grep -Eq '^[a-f0-9]{40}$'
          printf '%s' "$PLATFORM_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$'
          printf '%s' "$DEPLOYMENT_ID" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$'
          test -n "$SKILLS_PROMOTION_API_KEY"

          proof_dir="$(mktemp -d)"
          trap 'rm -rf "$proof_dir"' EXIT
          curl --fail --silent --show-error --retry 3 https://skills.md/api/version >"$proof_dir/version.json"
          curl --fail --silent --show-error --retry 3 https://skills.md/api/health >"$proof_dir/health.json"
          curl --fail --silent --show-error --retry 3 https://skills.md/api/v1/skills >"$proof_dir/catalog.json"
          curl --fail --silent --show-error --retry 3 https://skills.md/api/v1/skills/image >"$proof_dir/skill.json"
          curl --fail --silent --show-error --retry 3 \
            --header "Authorization: Bearer $SKILLS_PROMOTION_API_KEY" \
            --header "Content-Type: application/json" \
            --data '{"input":{},"args":[]}' \
            https://skills.md/api/v1/skills/image/quote >"$proof_dir/quote.json"

          curl --fail --silent --show-error --retry 3 \
            --header "Authorization: Bearer $SKILLS_PROMOTION_API_KEY" \
            --header "Content-Type: application/json" \
            --data '{"input":{},"args":[]}' \
            https://skills.md/api/v1/skills/skills-release-proof/quote >"$proof_dir/release-quote.json"
          release_quote_token="$(jq -er '.quoteToken // .quote.quoteToken // .data.quoteToken' "$proof_dir/release-quote.json")"
          release_attempt="skills-release-proof-${DEPLOYMENT_ID}-${GITHUB_RUN_ID}"
          curl --fail --silent --show-error --retry 3 \
            --header "Authorization: Bearer $SKILLS_PROMOTION_API_KEY" \
            --header "Content-Type: application/json" \
            --header "Idempotency-Key: $release_attempt" \
            --data "$(jq -cn --arg token "$release_quote_token" '{input:{},args:[],quoteToken:$token,approved:true}')" \
            https://skills.md/api/v1/runs/skills-release-proof >"$proof_dir/release-run.json"
          release_run_id="$(jq -er '.id // .run.id // .data.id' "$proof_dir/release-run.json")"
          for attempt in {1..30}; do
            curl --fail --silent --show-error --retry 3 \
              --header "Authorization: Bearer $SKILLS_PROMOTION_API_KEY" \
              "https://skills.md/api/v1/runs/${release_run_id}" >"$proof_dir/release-run.json"
            release_status="$(jq -er '.status // .run.status // .data.status' "$proof_dir/release-run.json")"
            if [ "$release_status" = "completed" ]; then break; fi
            if [ "$release_status" = "failed" ] || [ "$release_status" = "cancelled" ] || [ "$release_status" = "expired" ]; then
              echo "::error::release proof run ended in ${release_status}"; exit 1
            fi
            sleep 2
          done
          test "$(jq -er '.status // .run.status // .data.status' "$proof_dir/release-run.json")" = "completed"
          jq -e '{runs: [(.run // .data // .)]}' "$proof_dir/release-run.json" >"$proof_dir/runs.json"
          curl --fail --silent --show-error --retry 3 \
            --header "Authorization: Bearer $SKILLS_PROMOTION_API_KEY" \
            'https://skills.md/api/v1/billing/usage' >"$proof_dir/usage.json"

          bun run scripts/validate-live-public-contract.ts \
            "$proof_dir" "$PLATFORM_SHA" "$PLATFORM_VERSION" "$DEPLOYMENT_ID" "$CLIENT_PIN"
      - name: Verify exact prerelease artifact integrity
        shell: bash
        run: |
          set -euo pipefail
          test "$(npm view @hasna/skills@next version)" = "0.2.0"
          next_integrity="$(npm view @hasna/skills@next dist.integrity)"
          exact_integrity="$(npm view @hasna/skills@0.2.0 dist.integrity)"
          test -n "$next_integrity"
          test "$next_integrity" = "$exact_integrity"
      - name: Smoke exact npm artifact in isolation
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          cd "$smoke_dir"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-save @hasna/skills@0.2.0
          npx --no-install skills --version
          CI=1 npx --no-install skills >bare-skills.txt
          grep -q "skills" bare-skills.txt
          npx --no-install skills setup --mode local --json
      - name: Promote the tested artifact without rebuilding
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          before_integrity="$(npm view @hasna/skills@0.2.0 dist.integrity)"
          npm dist-tag add @hasna/skills@0.2.0 latest
          test "$(npm view @hasna/skills@latest version)" = "0.2.0"
          test "$(npm view @hasna/skills@latest dist.integrity)" = "$before_integrity"
