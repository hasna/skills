name: Skills packed consumer gate

# Packed-archive consumer acceptance for @hasna/skills that installs and runs
# floating third-party packages (the MCP SDK, zod releases, npm layouts). It is
# deliberately separate from release-skills.yml: no environment, no secrets, no
# id-token, read-only contents. The publish job never runs these layouts.
on:
  pull_request:
    paths:
      - "apps/skills/**"
      - ".github/workflows/skills-consumer-gate.yml"
  workflow_dispatch:

concurrency:
  group: skills-consumer-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  consumer-gate:
    if: github.repository == 'hasna/skills'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
          # Never save the toolchain cache from this job: its key matches the
          # release job's, and code under test here is not trusted to leave
          # ~/.bun/bin/bun untouched.
          no-cache: true

      - name: Install and verify the CI npm toolchain
        run: |
          set -euo pipefail
          npm_prefix="$(mktemp -d "$RUNNER_TEMP/npm-toolchain.XXXXXX")"
          npm install --global --prefix "$npm_prefix" npm@11.19.0
          test "$("$npm_prefix/bin/npm" --version)" = 11.19.0
          echo "$npm_prefix/bin" >> "$GITHUB_PATH"

      - name: Install locked standalone Skills dependencies
        working-directory: apps/skills
        run: bun install --frozen-lockfile --ignore-scripts --backend copyfile

      - name: Typecheck
        working-directory: apps/skills
        run: bun run typecheck

      - name: Build
        working-directory: apps/skills
        run: |
          umask 022
          bun run build

      - name: Unit tests for MCP registration, tools/list, and gate helpers
        working-directory: apps/skills
        env:
          NO_COLOR: "1"
        run: bun test --timeout 30000 src/mcp/package-tool-list.test.ts src/lib/mcp-zod-bundle.test.ts src/lib/release-candidate-archive.test.ts src/cli/commands/runtime-mcp-registration.test.ts

      - name: Run package-owned prepack gates
        working-directory: apps/skills
        run: bun run prepack

      - name: Pack the archive
        id: pack
        working-directory: apps/skills
        run: |
          set -euo pipefail
          umask 022
          destination="$RUNNER_TEMP/skills-gate-archive"
          mkdir -p "$destination"
          npm pack --ignore-scripts --json --pack-destination "$destination" > "$RUNNER_TEMP/skills-gate-pack.json"
          archive="$(node --input-type=module -e '
            const { readFileSync } = await import("node:fs");
            const packed = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/skills-gate-pack.json", "utf8"));
            if (!Array.isArray(packed) || packed.length !== 1) throw new Error("expected exactly one packed archive");
            console.log(packed[0].filename);
          ')"
          echo "archive=$destination/$archive" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$destination/$archive" | cut -d " " -f 1)" >> "$GITHUB_OUTPUT"

      - name: Packed MCP consumer layouts (bun floor and latest, npm split zod 4.3.5, 3.25.76 and 4.1.13)
        working-directory: apps/skills
        env:
          ARCHIVE: ${{ steps.pack.outputs.archive }}
          ARCHIVE_SHA256: ${{ steps.pack.outputs.sha256 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/skills-consumer-gate"
          bun run verify:consumer-mcp --archive "$ARCHIVE" --sha256 "$ARCHIVE_SHA256" \
            --npm-split-zod 4.3.5 --npm-split-zod 3.25.76 --npm-split-zod 4.1.13 \
            | tee "$RUNNER_TEMP/skills-consumer-gate/summary.jsonl"

      - name: Upload only the gate summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skills-consumer-gate-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/skills-consumer-gate/summary.jsonl
          if-no-files-found: warn
          retention-days: 14
