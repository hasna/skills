name: Skills packed consumer gate

# Packed-archive consumer acceptance for @hasna/skills that installs and runs
# floating third-party packages (the MCP SDK, zod releases, npm layouts). It is
# deliberately separate from release-skills.yml: no environment, no id-token,
# read-only contents. The publish job never runs these layouts.
#
# Two jobs (SH-00052). @hasna/secrets is a restricted package, so the frozen install needs the read-only
# NPM_RELEASE_READ_TOKEN. The runner holds every secret a job references for the whole job, so the token lives in a
# job that runs only lockfile-pinned code and this pull request's own code:
# - build: the credential-isolated install, typecheck, build, the unit tests and the Claude registration probe on the
#   locked tree, the prepack gates that resolve nothing outside the lockfile, and the pack. It uploads only the
#   packed tarball and its sha256, never an installed tree, because this repository's artifacts are public.
# - consumer: no secret at all. Everything that resolves packages outside the lockfile runs here, from the tarball.
on:
  pull_request:
    paths:
      - "apps/skills/**"
      - ".github/workflows/skills-consumer-gate.yml"
  workflow_dispatch:

concurrency:
  group: skills-consumer-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'hasna/skills'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    outputs:
      commit: ${{ steps.pack.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
          # Never save the toolchain cache from this job: its key matches the
          # release job's, and code under test here is not trusted to leave
          # ~/.bun/bin/bun untouched.
          no-cache: true

      - name: Install locked standalone Skills dependencies (credential isolated)
        working-directory: apps/skills
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_RELEASE_READ_TOKEN }}
        run: |
          set -euo pipefail
          # The one step in its job that holds a registry credential (SH-00052).
          # @hasna/secrets is a restricted package, so the frozen install needs an authenticated read.
          # NPM_RELEASE_READ_TOKEN is a read-only granular token for that package alone, stored as a
          # repository Actions secret. Fork and Dependabot pull requests receive no secrets: an empty
          # value fails closed here instead of falling back to an anonymous install that would 404 and
          # read as a broken lockfile rather than a missing credential.
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_RELEASE_READ_TOKEN is empty or unset. The frozen install needs this read-only repository Actions secret to read the restricted @hasna/secrets package; fork and Dependabot pull requests receive no secrets."
            exit 1
          fi
          # The credential reaches bun only through a throwaway HOME/.npmrc: bun 1.3.14 ignores an
          # npmrc named by NPM_CONFIG_USERCONFIG and honours HOME/.npmrc (measured in hasna/apps
          # H10-02274). The value is written by the shell builtin printf, so it never sits in a
          # process argv, and the file is removed when this step exits, on failure as on success.
          # Shell command tracing is never enabled in this step.
          cred_home="$(mktemp -d "${RUNNER_TEMP%/}/npm-read-home.XXXXXX")"
          trap 'rm -f "$cred_home/.npmrc"' EXIT
          umask 077
          chmod 700 "$cred_home"
          {
            printf 'registry=https://registry.npmjs.org/\n'
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN"
          } > "$cred_home/.npmrc"
          chmod 600 "$cred_home/.npmrc"
          cache_dir="$(mktemp -d "${RUNNER_TEMP%/}/bun-install-cache.XXXXXX")"
          # `env -u NODE_AUTH_TOKEN`: bun expands ${VAR} references inside a committed .npmrc, so the
          # variable is kept out of bun's environment and the literal auth line above is the only
          # route by which the value reaches the registry. The registry is pinned three ways.
          HOME="$cred_home" \
          BUN_INSTALL_CACHE_DIR="$cache_dir" \
          BUN_CONFIG_REGISTRY="https://registry.npmjs.org/" \
            env -u NODE_AUTH_TOKEN bun install --frozen-lockfile --ignore-scripts --backend copyfile --registry https://registry.npmjs.org/
          # Nothing the install left behind may carry the credential to a later step or job: no
          # .npmrc under node_modules or the install cache, and no file containing the token bytes.
          # The scan reads the value from its environment only and prints counts, never a value; an
          # unreadable path or an empty scan fails rather than passing.
          SCAN_ROOTS="node_modules:$cache_dir" python3 -I - <<'PYEOF'
          import os
          import sys

          token = os.environ.get("NODE_AUTH_TOKEN", "").encode()
          if not token:
              print("::error::the token is empty in the scan")
              sys.exit(1)
          errors, npmrc, hits = [], [], []
          files = links = 0
          chunk = 1 << 20

          def on_error(exc):
              errors.append(str(exc))

          for root in os.environ["SCAN_ROOTS"].split(":"):
              if not os.path.isdir(root):
                  errors.append("%s: not a directory" % root)
                  continue
              for dirpath, _dirnames, filenames in os.walk(root, onerror=on_error):
                  for name in filenames:
                      path = os.path.join(dirpath, name)
                      if name == ".npmrc":
                          npmrc.append(path)
                          continue
                      if os.path.islink(path):
                          links += 1
                          continue
                      files += 1
                      try:
                          with open(path, "rb") as handle:
                              tail = b""
                              while True:
                                  piece = handle.read(chunk)
                                  if not piece:
                                      break
                                  blob = tail + piece
                                  if token in blob:
                                      hits.append(path)
                                      break
                                  tail = blob[-(len(token) - 1):] if len(token) > 1 else b""
                      except OSError as exc:
                          errors.append("%s: %s" % (path, exc))

          if errors:
              print("::error::could not read %d path(s) after the install; an unreadable scan is not a pass" % len(errors))
              for line in errors[:10]:
                  print(line)
              sys.exit(1)
          if npmrc:
              print("::error::the installed tree contains %d .npmrc path(s)" % len(npmrc))
              for path in npmrc[:10]:
                  print(path)
              sys.exit(1)
          if files == 0:
              print("::error::scanned 0 files after the install; the coverage this step claims was never established")
              sys.exit(1)
          if hits:
              print("::error::%d installed file(s) contain the registry token" % len(hits))
              sys.exit(1)
          print("scanned %d files (%d symlinks skipped) after the install: no .npmrc, no token bytes" % (files, links))
          PYEOF

      - name: Typecheck
        working-directory: apps/skills
        run: bun run typecheck

      - name: Build
        working-directory: apps/skills
        run: |
          umask 022
          bun run build

      - name: Unit tests for MCP registration, tools/list, private create, and gate helpers
        working-directory: apps/skills
        env:
          NO_COLOR: "1"
        run: bun test --timeout 30000 src/mcp/package-tool-list.test.ts src/lib/mcp-zod-bundle.test.ts src/lib/release-candidate-archive.test.ts src/cli/commands/runtime-mcp-registration.test.ts src/cli/cli.private-skill-create.test.ts src/cli/cli.stray-arguments.test.ts src/cli/cli.private-skill-history.test.ts src/lib/private-skill-history.test.ts src/cli/cli.json-output.test.ts src/lib/profile-response-errors.test.ts

      # Stays in this job: the Claude Code archive it runs is pinned by version, SHA-1 and sha512 integrity, checked
      # before anything runs, so it resolves nothing floating, and the probe imports the scanner of the restricted
      # @hasna/secrets package, which only the locked tree here holds.
      - name: Credential-free Claude 2.1.302 native MCP registration (network isolated)
        working-directory: apps/skills
        run: bun --no-env-file --no-install scripts/probe-claude-mcp-registration.ts

      # The package's prepack is verify:generated, verify:release and verify:consumer-types. The first two run here on
      # the locked tree; verify:consumer-types resolves floating packages, so the consumer job runs it on the tarball.
      - name: Run the package-owned prepack gates that resolve nothing outside the lockfile
        working-directory: apps/skills
        run: |
          set -euo pipefail
          bun run verify:generated
          bun run verify:release

      # Packed with the npm that ships with the pinned Node, so this job fetches nothing outside the lockfile.
      - name: Pack the archive
        id: pack
        working-directory: apps/skills
        run: |
          set -euo pipefail
          umask 022
          destination="$RUNNER_TEMP/skills-gate-archive"
          mkdir -p "$destination"
          npm pack --ignore-scripts --json --pack-destination "$destination" > "$RUNNER_TEMP/skills-gate-pack.json"
          archive="$(node --input-type=module -e '
            const { readFileSync } = await import("node:fs");
            const packed = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/skills-gate-pack.json", "utf8"));
            if (!Array.isArray(packed) || packed.length !== 1) throw new Error("expected exactly one packed archive");
            console.log(packed[0].filename);
          ')"
          (cd "$destination" && sha256sum "$archive" > packed.sha256)
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Retain only the packed archive and its hash
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skills-gate-packed-${{ steps.pack.outputs.commit }}
          path: |
            ${{ runner.temp }}/skills-gate-archive/*.tgz
            ${{ runner.temp }}/skills-gate-archive/packed.sha256
          if-no-files-found: error
          retention-days: 1

  # No secret, no token, nothing installed from the lockfile. Every step here that resolves packages does so outside
  # the lockfile, which is why it is in this job:
  # - the npm toolchain install (npm@11.19.0 for the npm-split layouts);
  # - verify:consumer-types installs the tarball as an anonymous consumer: the package's own dependency ranges and the
  #   pinned TypeScript and type packages, resolved from the registry at run time;
  # - verify:consumer-mcp installs the tarball in bun and npm layouts with floating MCP SDK and zod releases and runs
  #   the installed MCP server.
  consumer:
    if: github.repository == 'hasna/skills'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Install and verify the CI npm toolchain
        run: |
          set -euo pipefail
          npm_prefix="$(mktemp -d "$RUNNER_TEMP/npm-toolchain.XXXXXX")"
          npm install --global --prefix "$npm_prefix" npm@11.19.0
          test "$("$npm_prefix/bin/npm" --version)" = 11.19.0
          echo "$npm_prefix/bin" >> "$GITHUB_PATH"

      - name: Require the build job's commit
        env:
          BUILT_COMMIT: ${{ needs.build.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$BUILT_COMMIT"

      - name: Restore the packed archive of this exact commit
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: skills-gate-packed-${{ needs.build.outputs.commit }}
          path: ${{ runner.temp }}/skills-gate-archive

      - name: Verify the packed archive against its recorded sha256
        id: archive
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/skills-gate-archive"
          shopt -s nullglob
          archives=(hasna-skills-*.tgz)
          test "${#archives[@]}" -eq 1
          test "$(wc -l < packed.sha256)" -eq 1
          sha256sum --check --strict packed.sha256
          read -r sha256 name < packed.sha256
          test "$name" = "${archives[0]}"
          echo "archive=$RUNNER_TEMP/skills-gate-archive/$name" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Installed consumer types for the packed archive (anonymous install, floating ranges)
        working-directory: apps/skills
        env:
          ARCHIVE: ${{ steps.archive.outputs.archive }}
          ARCHIVE_SHA256: ${{ steps.archive.outputs.sha256 }}
        run: bun run verify:consumer-types --archive "$ARCHIVE" --sha256 "$ARCHIVE_SHA256"

      - name: Packed MCP consumer layouts (bun floor and latest, npm split zod 4.3.5, 3.25.76 and 4.1.13)
        working-directory: apps/skills
        env:
          ARCHIVE: ${{ steps.archive.outputs.archive }}
          ARCHIVE_SHA256: ${{ steps.archive.outputs.sha256 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/skills-consumer-gate"
          bun run verify:consumer-mcp --archive "$ARCHIVE" --sha256 "$ARCHIVE_SHA256" \
            --npm-split-zod 4.3.5 --npm-split-zod 3.25.76 --npm-split-zod 4.1.13 \
            | tee "$RUNNER_TEMP/skills-consumer-gate/summary.jsonl"

      - name: Upload only the gate summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skills-consumer-gate-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/skills-consumer-gate/summary.jsonl
          if-no-files-found: warn
          retention-days: 14
